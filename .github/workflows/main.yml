name: API and dashboard tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run API contract tests
        run: python -m pytest -q tests/test_dashboard_api.py tests/test_notebook_pipeline.py
      - name: Validate the locked Processor D definition
        run: python tools/check_processor_d.py processors/processor_D.json 6
