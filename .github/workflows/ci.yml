name: Phase 2 reproducibility check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated Jupyter directories
        run: |
          echo "JUPYTER_CONFIG_DIR=$RUNNER_TEMP/jupyter/config" >> "$GITHUB_ENV"
          echo "JUPYTER_DATA_DIR=$RUNNER_TEMP/jupyter/data" >> "$GITHUB_ENV"
          echo "JUPYTER_RUNTIME_DIR=$RUNNER_TEMP/jupyter/runtime" >> "$GITHUB_ENV"
          echo "JUPYTER_PATH=$RUNNER_TEMP/jupyter/prefix/share/jupyter" >> "$GITHUB_ENV"
          echo "IPYTHONDIR=$RUNNER_TEMP/ipython" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/jupyter/config" "$RUNNER_TEMP/jupyter/data" "$RUNNER_TEMP/jupyter/runtime" "$RUNNER_TEMP/ipython"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned scientific environment
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Validate Processor D
        run: python tools/check_processor_d.py processors/processor_D.json 6
      - name: Regenerate seed and noisy architecture supplements from saved runs
        run: python scripts/run_phase2_s1.py --supplement-only
      - name: Prepare isolated notebook kernel
        run: |
          python -m ipykernel install --prefix "$RUNNER_TEMP/jupyter/prefix" --name phase2-ci --display-name "Python (Phase 2 CI)"
      - name: Execute Phase 2 notebook from saved result tables
        run: python -m nbconvert --to notebook --execute main.ipynb --output phase2-ci.ipynb --ExecutePreprocessor.timeout=1500 --ExecutePreprocessor.kernel_name=phase2-ci
