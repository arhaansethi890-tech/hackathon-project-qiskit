name: Phase 2 reproducibility check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned scientific environment
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Validate Processor D
        run: python tools/check_processor_d.py processors/processor_D.json 6
      - name: Execute Phase 2 notebook from saved result tables
        run: python -m nbconvert --to notebook --execute main.ipynb --output phase2-ci.ipynb --ExecutePreprocessor.timeout=1800 --ExecutePreprocessor.kernel_name=python3
